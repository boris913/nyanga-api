name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tests
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image Docker
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/nyanga-api:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Déploiement sur le serveur
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          OPS_BUCKET: ${{ vars.OPS_BUCKET }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          aws s3 cp infra/aws/server/ "s3://$OPS_BUCKET/deploy/" --recursive
          COMMANDS=$(jq -cn --arg c "mkdir -p /opt/nyanga && aws s3 cp s3://$OPS_BUCKET/deploy/ /opt/nyanga/ --recursive --region $AWS_REGION && bash /opt/nyanga/deploy.sh $GITHUB_SHA $REGISTRY $OPS_BUCKET" '{commands: [$c]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "nyanga $GITHUB_SHA" --parameters "$COMMANDS" --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$STATUS" = "Success"
