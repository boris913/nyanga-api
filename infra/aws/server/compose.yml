# Production : PostgreSQL + API sur le serveur EC2. Les variables viennent de .env,
# généré par deploy.sh depuis les paramètres SSM /nyanga/prod/*.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyanga
      POSTGRES_DB: nyanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Réglages pour un serveur de 1 Go de mémoire.
    command: postgres -c shared_buffers=64MB -c max_connections=30 -c work_mem=4MB
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyanga"]
      interval: 5s
      retries: 20
    logging: *logging

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://nyanga:${POSTGRES_PASSWORD}@db:5432/nyanga?connection_limit=5
      S3_REGION: eu-west-3
    ports:
      - "80:4000"
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
