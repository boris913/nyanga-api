AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Nyanga MVP (eu-west-3). Un serveur EC2 t3.micro fait tourner Caddy (HTTPS Let's Encrypt sur <ip>.sslip.io),
  l'API et PostgreSQL dans Docker. Les photos d'annonces (listings/*) sont lisibles publiquement dans S3,
  les selfies restent privés. Déploiement : GitHub Actions (OIDC) pousse l'image dans ECR puis lance deploy.sh
  via SSM Run Command. Données : volume EBS dédié conservé + sauvegarde quotidienne pg_dump dans le bucket ops.
  CloudFront n'est pas utilisé : il exige une vérification du compte par le support AWS.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI Amazon Linux 2023 x86_64 figée (une AMI changeante remplacerait le serveur à chaque mise à jour).
  InstanceType:
    Type: String
    Default: t3.micro
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Sous-réseau public par défaut ; le volume de données doit être dans la même zone.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
  GitHubSubject:
    Type: String
    Default: repo:boris913@120689453/nyanga-api@1420761063
    Description: Préfixe du sujet OIDC GitHub (format immuable propriétaire@id/dépôt@id, voir l'API actions/oidc/customization/sub).
  WebOrigin:
    Type: String
    Default: https://nyanga-web.vercel.app
    Description: Origine du site, autorisée en CORS pour l'envoi direct des photos vers S3.

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Photos des annonces (listings/*, publiques) et selfies de vérification (selfies/*, privés, liens signés).
        must: Seul listings/* est public, par la politique du bucket ; jamais d'ACL publique ni d'accès public à selfies/*.
    Properties:
      # Politique publique autorisée (pour listings/* uniquement) ; les ACL publiques restent bloquées.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: anciennes-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: [!Ref WebOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub "${MediaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: PublicReadListingPhotos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/listings/*"

  OpsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Fichiers de déploiement du serveur (deploy/*) et sauvegardes quotidiennes de la base (backups/*).
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: sauvegardes-30-jours
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: deploy-anciennes-versions
            Status: Enabled
            Prefix: deploy/
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  OpsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OpsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt OpsBucket.Arn
              - !Sub "${OpsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Garder les 10 dernières images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: nyanga-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${MediaBucket.Arn}/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${OpsBucket.Arn}/deploy/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${OpsBucket.Arn}/backups/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt OpsBucket.Arn
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/nyanga/prod"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Serveur HTTPS public (Vercel, navigateurs, webhooks Chariow, validation Let's Encrypt sur le port 80).
        must: Uniquement 80 et 443 ; aucun accès SSH (administration via SSM). Revenir à CloudFront seul quand le compte le permet.
    Properties:
      GroupDescription: Nyanga API - HTTP et HTTPS publics (Caddy)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP - redirection HTTPS et validation Lets Encrypt
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: udp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTP/3

  ServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          # 2 sauts : les conteneurs Docker doivent joindre IMDSv2 pour obtenir les droits S3 du rôle.
          HttpPutResponseHopLimit: 2

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Données PostgreSQL, séparées du disque système pour survivre à un remplacement du serveur.
        must: Ne jamais supprimer sans sauvegarde vérifiée ; même zone que le serveur.
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: 10
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: nyanga-postgres

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!GetAtt ServerSecurityGroup.GroupId]
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref ServerLaunchTemplate
        Version: !GetAtt ServerLaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: nyanga-api
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=1024
            chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi
          VOLUME_ID="${DataVolume}"
          DEV="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_vol${!VOLUME_ID#vol-}"
          for i in $(seq 1 120); do [ -e "$DEV" ] && break; sleep 5; done
          blkid "$DEV" || mkfs.xfs "$DEV"
          mkdir -p /data
          grep -q ' /data ' /etc/fstab || echo "$DEV /data xfs defaults,nofail 0 2" >> /etc/fstab
          mount -a
          mkdir -p /data/postgres /opt/nyanga

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Server
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  ServerIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: nyanga-api

  ServerIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ServerIp.AllocationId
      InstanceId: !Ref Server

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Déploiement sans clé longue durée depuis GitHub Actions (fournisseur OIDC déjà présent dans le compte).
        must: Limité à la branche main du dépôt désigné par GitHubSubject.
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "${GitHubSubject}:ref:refs/heads/main"
      Policies:
        - PolicyName: nyanga-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${OpsBucket.Arn}/deploy/*"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Server}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

Outputs:
  ApiDomain:
    Description: Nom d'hôte HTTPS de l'API (paramètre SSM API_DOMAIN lu par Caddy).
    Value: !Join ["", [!Join ["-", !Split [".", !Ref ServerIp]], ".sslip.io"]]
  ApiUrl:
    Description: URL publique de l'API (API_URL côté Vercel, webhook Chariow sur /api/webhooks/chariow).
    Value: !Join ["", ["https://", !Join ["-", !Split [".", !Ref ServerIp]], ".sslip.io"]]
  MediaPublicUrl:
    Value: !Sub "https://${MediaBucket.RegionalDomainName}"
  MediaBucketName:
    Value: !Ref MediaBucket
  OpsBucketName:
    Value: !Ref OpsBucket
  InstanceId:
    Value: !Ref Server
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
